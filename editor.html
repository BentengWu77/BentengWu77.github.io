<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>内容编辑 · 吴奔腾</title><link rel="stylesheet" href="style.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23122e47'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='30' fill='white'%3EBW%3C/text%3E%3C/svg%3E"><script src="editor.js" defer></script></head><body><main class="edit-shell"><div class="edit-top"><div><span class="eyebrow">CONTENT EDITOR</span><h1 style="font-size:34px">网站内容编辑</h1></div><a class="text-link" href="index.html">返回网站 ↗</a></div><p class="notice">这是本地编辑工具，无需登录。修改仅保存在当前浏览器，不会直接改变线上网站。完成编辑后请导出网站文件，由网站持有人发布。任何访客都无法通过此页面修改线上内容。</p><div class="edit-tabs" role="tablist" aria-label="编辑栏目"></div><div id="edit-panel" class="edit-panel" role="tabpanel"></div><div class="edit-toolbar"><button id="preview" class="button secondary">预览草稿</button><button id="export-json" class="button secondary">导出内容备份</button><label class="button secondary" style="cursor:pointer">导入内容备份<input id="import-json" type="file" accept=".json,application/json" class="sr-only"></label><button id="export-site" class="button">导出完整网站 ZIP</button></div><p id="status" class="status" role="status" aria-live="polite"></p><p class="small-note">论文：填写 → 保存 → 预览 → 导出。更换简历后，请在关闭页面前导出完整网站。发布方式见随网站交付的使用说明。</p></main></body></html>
